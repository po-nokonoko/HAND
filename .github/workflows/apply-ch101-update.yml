name: Apply reviewed CH101 scoring and switching update

on:
  push:
    branches:
      - ch101-scoring-switching-v2
    paths:
      - .github/workflows/apply-ch101-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ch101-scoring-switching-v2
          fetch-depth: 0

      - name: Reconstruct reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/ch101_update"
          mkdir -p "$workdir"
          cat .github/ch101-payload/part{00..12} > "$RUNNER_TEMP/ch101_update.tar.gz.b64"
          echo "d3e27314f422d7016b1113e059f3b2f78e6528110de40ac1934c8e2ed0433440  $RUNNER_TEMP/ch101_update.tar.gz.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/ch101_update.tar.gz.b64" > "$RUNNER_TEMP/ch101_update.tar.gz"
          echo "5db648e5dab970904768f54f4e3e5f2ca43148b08f6a81d25a47eb5425094af5  $RUNNER_TEMP/ch101_update.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ch101_update.tar.gz" -C "$workdir"

          cp "$workdir/hand_task_ch101_scored.c" src/hand_modules/hand_task/hand_task.c
          cp "$workdir/hand_config.h" include/hand_config.h
          mkdir -p tests/host docs
          cp "$workdir/CH101_scoring_switching_host_test.c" tests/host/CH101_scoring_switching_host_test.c
          cp "$workdir/verify_ch101_scoring_test_sync.py" tests/host/verify_ch101_scoring_test_sync.py
          cp "$workdir/CH101_SCORING_SWITCHING_IMPLEMENTATION.md" docs/CH101_SCORING_SWITCHING_IMPLEMENTATION.md
          cp "$workdir/CH101_SCORING_SWITCHING_VALIDATION.md" docs/CH101_SCORING_SWITCHING_VALIDATION.md
          chmod +x tests/host/verify_ch101_scoring_test_sync.py

          rm -f patches/hand_task_ch101_scoring.patch.gz.b64
          rm -f reference/hand_task_ch101_scored.c.gz.b64
          rm -f tests/host/CH101_scoring_switching_host_test.c.gz.b64
          rm -f docs/CH101_SCORING_SWITCHING_ARTIFACTS.md
          rm -rf .github/ch101-payload
          rm -f .github/workflows/apply-ch101-update.yml

      - name: Verify exact production files
        shell: bash
        run: |
          set -euo pipefail
          echo "1c92eaf81c2b66b883d6210096552268713e8ee97deef4083a1b207e5ae36123  src/hand_modules/hand_task/hand_task.c" | sha256sum -c -
          echo "e74d96da58102290e0574ec51c62094811c40bf8a70cb5a8e6a31ba4c76948b3  include/hand_config.h" | sha256sum -c -
          echo "e107c3ae94d2cff86e131c74aa4782152e860007a94e5f742219b1934c925d21  tests/host/CH101_scoring_switching_host_test.c" | sha256sum -c -
          echo "8369dee7cbe57e872f9fbd7504f403531297efacaaba05d8664099172a60d67d  tests/host/verify_ch101_scoring_test_sync.py" | sha256sum -c -

      - name: Run strict host validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/host/verify_ch101_scoring_test_sync.py
          gcc -std=c11 \
            -Wall -Wextra -Werror -Wformat=2 \
            -Wshadow -Wconversion -Wsign-conversion \
            tests/host/CH101_scoring_switching_host_test.c \
            -lm -o "$RUNNER_TEMP/ch101_scoring_switching_test"
          "$RUNNER_TEMP/ch101_scoring_switching_test"

      - name: Commit production integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate CH101 range-quality scoring and TX switching"
          git push origin HEAD:ch101-scoring-switching-v2
